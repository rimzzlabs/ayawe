# Opens a release PR from conventional commits on main. Merging it tags the release
# and updates CHANGELOG.md and the version in the root package.json.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0, pinned to a commit so a moved tag cannot change what runs.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
