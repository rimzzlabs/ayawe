# Opens a release PR from conventional commits on main. Merging it tags the release,
# updates CHANGELOG.md and the version in the root package.json, and deploys to Cloudflare.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # v5.0.0. Each action is pinned to a commit, so a moved tag cannot change what runs.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Only one deploy at a time. A second release waits for the first to finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: production
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v6.1.0. Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm exec moon run :lint :typecheck :test

      # Builds the web app, applies the D1 migrations, and deploys the Worker.
      - name: Deploy
        run: pnpm exec moon run api:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
