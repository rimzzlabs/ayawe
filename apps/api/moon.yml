$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"
tags: ["worker"]

dependsOn: ["crypto"]

tasks:
  db-migrate-local:
    command: "wrangler d1 migrations apply ayawe --local"
    inputs: ["migrations/**/*"]
    options:
      cache: false
      runInCI: false

  # The deploy workflow runs with CI=true, so these tasks must run in CI.
  db-migrate-remote:
    command: "wrangler d1 migrations apply ayawe --remote"
    options:
      cache: false
      runInCI: true

  dev:
    command: "wrangler dev"
    preset: "server"
    deps: ["web:build", "~:db-migrate-local"]

  deploy:
    command: "wrangler deploy"
    deps: ["web:build", "~:typecheck", "~:db-migrate-remote"]
    options:
      cache: false
      runInCI: true
