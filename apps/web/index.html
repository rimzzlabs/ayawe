<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Search and link previews for the landing page. %SITE_URL% comes from vite-plugins/seo.ts. -->
    <title>Your .env files, in one encrypted vault · ayawe</title>
    <meta
      name="description"
      content="An encrypted vault for .env files. Your browser encrypts every value, so the server only stores ciphertext. Free, open source, and self-hostable."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ayawe" />
    <meta property="og:title" content="ayawe: an encrypted vault for your .env files" />
    <meta
      property="og:description"
      content="Keep every project's environment variables in one place. Your browser encrypts them with AES-256-GCM, so the server only stores ciphertext."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The ayawe wordmark and the line: Your .env files, in one encrypted vault."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ayawe",
        "url": "%SITE_URL%/",
        "description": "An encrypted vault for .env files. Values are encrypted in the browser, so the server only stores ciphertext.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Runs before the first paint, so the stored theme applies without a flash.
      // Keep the storage key in sync with src/lib/theme.ts.
      (() => {
        const root = document.documentElement;
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const storedTheme = () => {
          try {
            const value = localStorage.getItem("ayawe:theme");
            return value === "dark" || value === "light" ? value : null;
          } catch {
            return null;
          }
        };
        const applyTheme = (dark) => root.classList.toggle("dark", dark);
        const theme = storedTheme();
        applyTheme(theme ? theme === "dark" : media.matches);
        media.addEventListener("change", (event) => {
          if (storedTheme() === null) applyTheme(event.matches);
        });
      })();
    </script>
    <script>
      // The prerendered landing page is the HTML for every path. On other paths, hide it before
      // the first paint. src/main.tsx clears it and removes this flag.
      if (location.pathname !== "/") document.documentElement.dataset.appShell = "";
      // A display hint from the last visit, so the landing page shows the right header at once.
      // Keep the key in sync with src/lib/session.ts.
      try {
        if (localStorage.getItem("ayawe:signed-in")) {
          document.documentElement.setAttribute("data-signed-in", "");
        }
      } catch {}
    </script>
    <style>
      [data-app-shell] #root {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
