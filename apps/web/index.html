<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ayawe</title>
    <script>
      // Runs before the first paint, so the stored theme applies without a flash.
      // Keep the storage key in sync with src/lib/theme.ts.
      (() => {
        const root = document.documentElement;
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const storedTheme = () => {
          try {
            const value = localStorage.getItem("ayawe:theme");
            return value === "dark" || value === "light" ? value : null;
          } catch {
            return null;
          }
        };
        const applyTheme = (dark) => root.classList.toggle("dark", dark);
        const theme = storedTheme();
        applyTheme(theme ? theme === "dark" : media.matches);
        media.addEventListener("change", (event) => {
          if (storedTheme() === null) applyTheme(event.matches);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
