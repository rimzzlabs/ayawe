$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"
tags: ["frontend"]

dependsOn: ["crypto"]

fileGroups:
  sources: ["src/**/*", "vite-plugins/**/*", "index.html", "vite.config.ts"]

tasks:
  dev:
    command: "vite"
    preset: "server"

  test:
    command: "vitest run"
    inputs:
      - "@group(sources)"

  build:
    command: "vite build"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      # The SEO tags, robots.txt, and sitemap.xml use it, so a new value must rebuild.
      - "$SITE_URL"
    outputs:
      - "dist"
